<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>결제 완료 | OOTD STORE</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="header"></div>

  <main class="result" id="result">
    <h1>결제를 승인하고 있어요</h1>
    <p class="sub">잠시만 기다려 주세요.</p>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script>
    renderLayout("cart");

    // 토스페이먼츠가 successUrl 로 넘겨주는 값: paymentType, orderId, paymentKey, amount
    const paymentKey = qs("paymentKey");
    const orderId = qs("orderId");
    const amount = Number(qs("amount"));
    const pending = load("pendingOrder", null);
    const root = document.getElementById("result");

    const SERVER_ERRORS = {
      ORDER_NOT_FOUND: "주문 정보를 찾을 수 없어요. 테스트 서버가 재시작됐을 수 있어요.",
      AMOUNT_MISMATCH: "주문 금액과 결제 금액이 일치하지 않아요.",
      INVALID_ITEMS: "주문 상품 정보를 확인할 수 없어요. 결제한 브라우저에서 다시 열어 주세요.",
      INVALID_REQUEST: "결제 정보가 올바르지 않아요.",
    };

    function showFail(code, message) {
      root.innerHTML = `
        <div class="icon fail">!</div>
        <h1>결제를 승인하지 못했어요</h1>
        <p class="sub">${escapeHtml(SERVER_ERRORS[code] || message)}</p>
        <dl><div><dt>에러 코드</dt><dd>${escapeHtml(code)}</dd></div></dl>
        <div class="btns-row"><a class="btn btn-white" href="index.html">홈으로</a><a class="btn btn-black" href="checkout.html">다시 결제하기</a></div>`;
    }

    function showDone(payment) {
      const customer = pending && pending.orderId === orderId ? pending.customer : null;
      if (pending && pending.orderId === orderId) {
        if (pending.from === "cart") Cart.set([]);
        save("pendingOrder", null);
      }
      save("lastOrder", payment);

      const method = payment.method + (payment.card ? ` (${payment.card.number})` : "");
      root.innerHTML = `
        <div class="icon ok">✓</div>
        <h1>주문이 완료됐어요</h1>
        <p class="sub">${customer ? escapeHtml(customer.name) + "님, " : ""}구매해 주셔서 감사합니다.</p>
        <dl>
          <div><dt>주문번호</dt><dd>${escapeHtml(payment.orderId)}</dd></div>
          <div><dt>주문 상품</dt><dd>${escapeHtml(payment.orderName)}</dd></div>
          <div><dt>결제 금액</dt><dd>${won(payment.totalAmount)}</dd></div>
          <div><dt>결제 수단</dt><dd>${escapeHtml(method)}</dd></div>
          <div><dt>승인 시각</dt><dd>${new Date(payment.approvedAt).toLocaleString("ko-KR")}</dd></div>
          ${customer ? `<div><dt>배송지</dt><dd>${escapeHtml(customer.addr)}</dd></div>` : ""}
        </dl>
        ${payment.receipt && payment.receipt.url ? `<p class="notice" style="text-align:left"><a href="${escapeHtml(payment.receipt.url)}" target="_blank" rel="noopener"><u>영수증 보기</u></a></p>` : ""}
        <p class="notice" style="text-align:left">※ 토스페이먼츠 테스트 결제라 실제로 청구되지 않아요.</p>
        <div class="btns-row" id="done-btns"><a class="btn btn-white" href="index.html">홈으로</a><a class="btn btn-black" href="tops.html">쇼핑 계속하기</a></div>`;

      // 회원이면 주문 상세로 바로 갈 수 있어요.
      Auth.ready.then(() => {
        if (!Auth.user) return;
        document.getElementById("done-btns").innerHTML =
          `<a class="btn btn-white" href="tops.html">쇼핑 계속하기</a><a class="btn btn-black" href="order.html?id=${encodeURIComponent(payment.orderId)}">주문 내역 보기</a>`;
      });
    }

    // 결제 승인: 서버가 저장된 주문 금액과 비교한 뒤 시크릿 키로 토스페이먼츠 승인 API를 호출해요.
    async function confirmPayment() {
      if (!paymentKey || !orderId || !amount) return showFail("INVALID_REQUEST", "");

      // 새로고침: 이미 승인된 주문이면 저장된 결과를 보여줘요. (승인을 두 번 요청하지 않도록)
      const last = load("lastOrder", null);
      if (last && last.orderId === orderId && last.status === "DONE") return showDone(last);

      // items 는 서버가 금액을 다시 계산하고 주문에 함께 저장하는 데 써요.
      const items = pending && pending.orderId === orderId ? pending.items : [];
      try {
        const res = await fetch("/api/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ paymentKey, orderId, amount, items }),
        });
        const data = await res.json();
        if (!res.ok) return showFail(data.code || "CONFIRM_FAILED", data.message || "결제 승인에 실패했어요.");
        showDone(data);
      } catch (err) {
        showFail("NETWORK_ERROR", "테스트 서버(serve.ps1)에 연결할 수 없어요.");
      }
    }

    confirmPayment();
  </script>
</body>
</html>
