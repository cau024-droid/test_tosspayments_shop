<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>결제 실패 | OOTD STORE</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="header"></div>

  <main class="result" id="result"></main>

  <div id="footer"></div>

  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script>
    renderLayout("cart");

    // 토스페이먼츠가 failUrl 로 넘겨주는 값: code, message, orderId
    const code = qs("code") || "UNKNOWN_ERROR";
    const message = qs("message") || "알 수 없는 오류가 발생했어요.";
    const orderId = qs("orderId");

    document.getElementById("result").innerHTML = `
      <div class="icon fail">!</div>
      <h1>결제에 실패했어요</h1>
      <p class="sub">${escapeHtml(message)}</p>
      <dl>
        <div><dt>에러 코드</dt><dd>${escapeHtml(code)}</dd></div>
        ${orderId ? `<div><dt>주문번호</dt><dd>${escapeHtml(orderId)}</dd></div>` : ""}
      </dl>
      <div class="btns-row">
        <a class="btn btn-white" href="index.html">홈으로</a>
        <a class="btn btn-black" href="checkout.html">다시 결제하기</a>
      </div>`;
  </script>
</body>
</html>
