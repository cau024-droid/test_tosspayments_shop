<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>상품 상세 | OOTD STORE</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="header"></div>

  <main class="inner" id="detail-root"></main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script>
    const p = getProduct(qs("id"));
    renderLayout(p ? p.cat : "home");
    const root = document.getElementById("detail-root");

    if (!p) {
      root.innerHTML = `<p class="empty">상품을 찾을 수 없어요. <a href="index.html"><u>홈으로</u></a></p>`;
    } else {
      document.title = `${p.name} | OOTD STORE`;
      const cat = CATEGORIES[p.cat];
      const off = pct(p);
      const state = { size: null, qty: 1 };

      root.innerHTML = `
        <div class="page-head" style="padding-bottom:0">
          <div class="breadcrumb"><a href="index.html">홈</a> › <a href="${cat.page}">${cat.name}</a> › ${p.sub}</div>
        </div>
        <div class="detail">
          <div class="thumb" style="background:${p.bg}"><div class="art">${productArt(p)}</div></div>
          <div>
            <a class="d-brand" href="${cat.page}">${escapeHtml(p.brand)}</a>
            <h1 class="d-name">${escapeHtml(p.name)}</h1>
            <div class="d-price">
              ${off > 0 ? `<span class="origin">${won(p.price)}</span>` : ""}
              <span class="now">${off > 0 ? `<span class="discount">${off}%</span>` : ""}${won(p.sale)}</span>
            </div>
            <dl class="d-rows">
              <div class="d-row"><dt>후기</dt><dd id="d-reviews"></dd></div>
              <div class="d-row"><dt>좋아요</dt><dd id="d-likes"></dd></div>
              <div class="d-row"><dt>배송</dt><dd>${p.free ? "무료배송 · " : "배송비 3,000원 · "}오늘 출발 (오후 2시 전 주문)</dd></div>
            </dl>

            <div class="opt-label">사이즈</div>
            <div class="sizes" id="sizes">
              ${cat.sizes.map((s) => `<button type="button" class="size" data-size="${s}">${s}</button>`).join("")}
            </div>

            <div class="opt-label">수량</div>
            <div class="qty">
              <button type="button" id="minus" aria-label="수량 감소">−</button>
              <input id="qty" type="number" min="1" max="10" value="1" aria-label="수량" />
              <button type="button" id="plus" aria-label="수량 증가">+</button>
            </div>

            <div class="total-box"><span>총 상품 금액</span><strong id="total">${won(p.sale)}</strong></div>

            <div class="btns">
              <button type="button" class="btn btn-white btn-icon like-btn-big" id="like" aria-label="좋아요">${Likes.has(p.id) ? "♥" : "♡"}</button>
              <button type="button" class="btn btn-white" id="add-cart">장바구니</button>
              <button type="button" class="btn btn-black" id="buy-now">구매하기</button>
            </div>
          </div>
        </div>
        <section class="reviews" id="reviews">
          <div class="section-title"><h2 id="reviews-title">리뷰</h2></div>
          <div id="review-list"><p class="empty">리뷰를 불러오고 있어요.</p></div>
        </section>`;

      // 실제 좋아요 수·리뷰 수·평균 별점 (Stats 가 새 값을 받으면 다시 그려요)
      const drawStats = () => {
        document.getElementById("d-reviews").textContent = p.reviews ? `★ ${p.rating} · ${p.reviews.toLocaleString()}개` : "아직 리뷰가 없어요";
        document.getElementById("d-likes").textContent = `♥ ${p.likes.toLocaleString()}`;
      };
      drawStats();
      document.addEventListener("stats:change", drawStats);

      // ---- 리뷰 (최신순). 리뷰는 실제로 산 회원만 주문 상세에서 쓸 수 있어요. ----
      let reviews = [];
      const listEl = document.getElementById("review-list");
      const drawReviews = () => {
        const mineId = Auth.user ? Auth.user.id : null;
        const avg = reviews.length ? (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1) : null;
        document.getElementById("reviews-title").innerHTML =
          `리뷰 ${reviews.length.toLocaleString()}` + (avg ? ` <span class="review-avg">★ ${avg}</span>` : "");
        listEl.innerHTML = reviews.length
          ? reviews.map((r) => reviewHtml(r, r.user_id === mineId)).join("")
          : `<p class="empty" style="padding:40px 0">아직 리뷰가 없어요. 이 상품을 사셨다면 마이페이지 › 주문 상세에서 리뷰를 남겨 주세요.</p>`;
      };
      const loadReviews = async () => {
        if (!sb) return (listEl.innerHTML = `<p class="empty" style="padding:40px 0">리뷰를 불러오지 못했어요.</p>`);
        const { data, error } = await sb.from("reviews").select("*").eq("product_id", p.id).order("created_at", { ascending: false }).limit(100);
        if (error) return (listEl.innerHTML = `<p class="empty" style="padding:40px 0">리뷰를 불러오지 못했어요.</p>`);
        reviews = data;
        drawReviews();
      };
      loadReviews();
      document.addEventListener("auth:change", drawReviews);

      // 내 리뷰 수정·삭제
      listEl.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-act]");
        if (!btn) return;
        const el = btn.closest("[data-review]");
        const r = reviews.find((x) => String(x.id) === el.dataset.review);
        if (!r) return;
        if (btn.dataset.act === "delete") {
          if (!confirm("리뷰를 지울까요?")) return;
          try {
            await Reviews.remove(r.id);
            reviews = reviews.filter((x) => x !== r);
            drawReviews();
            toast("리뷰를 지웠어요");
          } catch (err) {
            toast(err.message);
          }
          return;
        }
        if (btn.dataset.act === "edit") {
          el.innerHTML = reviewFormHtml(r);
          bindReviewForm(el.querySelector("form"), {
            rating: r.rating,
            onCancel: drawReviews,
            onSubmit: async ({ rating, content }) => {
              const saved = await Reviews.save({ id: r.id, rating, content });
              reviews = reviews.map((x) => (x.id === r.id ? saved : x));
              drawReviews();
              toast("리뷰를 고쳤어요");
            },
          });
        }
      });

      const qtyInput = document.getElementById("qty");
      const setQty = (n) => {
        state.qty = Math.max(1, Math.min(10, n || 1));
        qtyInput.value = state.qty;
        document.getElementById("total").textContent = won(p.sale * state.qty);
      };
      document.getElementById("minus").onclick = () => setQty(state.qty - 1);
      document.getElementById("plus").onclick = () => setQty(state.qty + 1);
      qtyInput.onchange = () => setQty(parseInt(qtyInput.value, 10));

      document.getElementById("sizes").addEventListener("click", (e) => {
        const b = e.target.closest("[data-size]");
        if (!b) return;
        state.size = b.dataset.size;
        document.querySelectorAll(".size").forEach((s) => s.classList.toggle("active", s === b));
      });

      const likeBtn = document.getElementById("like");
      likeBtn.onclick = () => {
        const on = Likes.toggle(p.id);
        likeBtn.textContent = on ? "♥" : "♡";
        drawStats();
        toast(on ? "좋아요에 추가했어요" : "좋아요를 취소했어요");
      };
      // 로그인해서 계정의 좋아요를 받아오면 하트를 맞춰요.
      document.addEventListener("likes:change", () => { likeBtn.textContent = Likes.has(p.id) ? "♥" : "♡"; });

      const needSize = () => {
        if (state.size) return false;
        toast("사이즈를 선택해 주세요");
        return true;
      };
      document.getElementById("add-cart").onclick = () => {
        if (needSize()) return;
        Cart.add(p.id, state.size, state.qty);
        toast("장바구니에 담았어요");
      };
      document.getElementById("buy-now").onclick = () => {
        if (needSize()) return;
        save("checkout", { from: "direct", items: [{ id: p.id, size: state.size, qty: state.qty }] });
        location.href = "checkout.html";
      };
    }
  </script>
</body>
</html>
